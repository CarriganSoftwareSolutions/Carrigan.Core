```yaml
name: Publish to NuGet (version/0.x)

on:
  push:
    branches:
      - version/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CarriganCore/CarriganCore.sln

      - name: Build
        run: dotnet build CarriganCore/CarriganCore.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test
          --project CarriganCore/Carrigan.Core.Test/Carrigan.Core.Test.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura*.xml
          if-no-files-found: warn

  build-pack:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      is_alpha: ${{ steps.package_kind.outputs.is_alpha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CarriganCore/CarriganCore.sln

      - name: Build
        run: dotnet build CarriganCore/CarriganCore.sln --configuration Release --no-restore

      - name: Create artifacts directory
        run: mkdir -p ./artifacts

      - name: Pack Carrigan.Core
        run: >-
          dotnet pack CarriganCore/Carrigan.Core/Carrigan.Core.csproj
          --configuration Release
          --no-build
          -o ./artifacts
          --include-symbols
          -p:SymbolPackageFormat=snupkg

      - name: Pack Carrigan.Core.Mvc
        run: >-
          dotnet pack CarriganCore/Carrigan.Core.Mvc/Carrigan.Core.Mvc.csproj
          --configuration Release
          --no-build
          -o ./artifacts
          --include-symbols
          -p:SymbolPackageFormat=snupkg

      - name: Pack Carrigan.Core.Razor
        run: >-
          dotnet pack CarriganCore/Carrigan.Core.Razor/Carrigan.Core.Razor.csproj
          --configuration Release
          --no-build
          -o ./artifacts
          --include-symbols
          -p:SymbolPackageFormat=snupkg

      - name: Pack Carrigan.Core.Analyzers
        run: >-
          dotnet pack CarriganCore/Carrigan.Core.Analyzers/Carrigan.Core.Analyzers.csproj
          --configuration Release
          --no-build
          -o ./artifacts

      - name: Detect alpha packages
        id: package_kind
        shell: bash
        run: |
          if find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print | grep -qi -- '-alpha\.'; then
            echo "is_alpha=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_alpha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List generated packages
        shell: bash
        run: |
          echo "Generated NuGet packages:"
          find ./artifacts -maxdepth 1 -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -print

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-alpha:
    needs: build-pack
    if: needs.build-pack.outputs.is_alpha == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: YOUR_NUGET_USERNAME

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print0 |
          while IFS= read -r -d '' file; do
            dotnet nuget push "$file" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate \
              --no-symbols
          done

      - name: Publish symbols to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          find ./artifacts -maxdepth 1 -type f -name '*.snupkg' -print0 |
          while IFS= read -r -d '' file; do
            dotnet nuget push "$file" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

  publish-release:
    needs: build-pack
    if: needs.build-pack.outputs.is_alpha != 'true'
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: YOUR_NUGET_USERNAME

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print0 |
          while IFS= read -r -d '' file; do
            dotnet nuget push "$file" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate \
              --no-symbols
          done

      - name: Publish symbols to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          find ./artifacts -maxdepth 1 -type f -name '*.snupkg' -print0 |
          while IFS= read -r -d '' file; do
            dotnet nuget push "$file" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
```
